<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your Anchor password</title>
</head>
<body style="margin:0;padding:0;background:#020617;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e2e8f0;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#020617;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background:#0b1220;border:1px solid rgba(148,163,184,0.18);border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 8px;text-align:center;">
              <img src="{{ .SiteURL }}/anchor-wordmark.png" alt="Anchor" width="168" height="auto" style="display:inline-block;max-width:168px;height:auto;border:0;" />
            </td>
          </tr>
          <tr>
            <td style="padding:12px 28px 0;text-align:center;">
              <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:800;color:#f8fafc;letter-spacing:-0.02em;">Reset your password</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 28px 0;text-align:center;">
              <p style="margin:0;font-size:15px;line-height:1.55;color:#94a3b8;">
                We received a request to reset the password for your Anchor account. Tap below to choose a new one.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;text-align:center;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c9a558;color:#0b1220;text-decoration:none;font-weight:800;font-size:15px;letter-spacing:-0.01em;padding:13px 28px;border-radius:999px;">
                Reset password
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 24px;text-align:center;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#94a3b8;">
                If you didn’t ask for this, you can ignore this email — your password won’t change.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 22px;border-top:1px solid rgba(148,163,184,0.14);text-align:center;">
              <p style="margin:0;font-size:11px;line-height:1.5;color:#94a3b8;">
                Anchor · Quote like a pro
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
